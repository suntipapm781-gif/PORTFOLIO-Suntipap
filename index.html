<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PORTFOLIO : SUNTIPAP MEEMANGKANG</title>

  <style>
    :root {
      --nav-height: 68px;      /* ความสูงของแถบเขียวด้านบน */
      --nav-height-mobile: 56px;
      --hero-trim: 0px;        /* ถ้าไฟล์ 8.png มีขอบขาวด้านบน ให้ใส่ค่าที่ต้องการครอปออก เช่น 100px */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0b0b0b;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      padding-top: var(--nav-height); /* ดันเนื้อหาลงมาให้ชิด nav พอดี */
    }

    /* =========================
       HEADER
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #384a38;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #c9bb9b;
    }

    .menu {
      display: flex;
      gap: 28px;
    }

    .menu a {
      color: #111111;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    /* =========================
       HERO
    ========================= */

    #home {
      width: 100%;
      scroll-margin-top: var(--nav-height);
    }

    .hero {
      width: 100%;
      overflow: hidden; /* ใช้ซ่อนส่วนที่ครอปออก */
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      margin-top: calc(var(--hero-trim) * -1);
    }

    /* =========================
       WORKS (ภาพต่อกันเลย ไม่มีช่องว่าง)
    ========================= */

    #works {
      width: 100%;
    }

    .work {
      width: 100%;
    }

    .work img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* =========================
       CONTACT
    ========================= */

    #contact {
      min-height: 70vh;
      padding: 120px 28px;
      display: flex;
      align-items: center;
      background: #ffffff;
      scroll-margin-top: var(--nav-height);
    }

    .contact-container {
      width: 100%;
      margin: auto;
    }

    .contact-container h2 {
      font-size: clamp(50px, 10vw, 140px);
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .contact-container p {
      margin-top: 40px;
      font-size: 18px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding-top: var(--nav-height-mobile);
      }

      nav {
        height: var(--nav-height-mobile);
        padding: 0 18px;
      }

      #home,
      #contact {
        scroll-margin-top: var(--nav-height-mobile);
      }

      .logo {
        font-size: 11px;
      }

      .menu {
        gap: 16px;
      }

      .menu a {
        font-size: 11px;
      }

      #contact {
        padding: 100px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <nav>
    <div class="logo">
      PORTFOLIO : SUNTIPAP MEEMANGKANG
    </div>

    <div class="menu">
      <a href="#home">HOME</a>
      <a href="#contact">CONTACT</a>
    </div>
  </nav>


  <!-- HERO -->
  <section id="home">
    <div class="hero">
      <img src="works/8.png" alt="Portfolio Hero">
    </div>
  </section>


  <!-- WORKS -->
  <section id="works">

    <div class="work">
      <img src="works/5.png" alt="Work 01">
    </div>

    <div class="work">
      <img src="works/6.png" alt="Work 02">
    </div>

    <div class="work">
      <img src="works/7.png" alt="Work 03">
    </div>

    <!-- งานอื่น ๆ เพิ่มตรงนี้ได้เลย -->

  </section>


  <!-- CONTACT -->
  <section id="contact">
    <div class="contact-container">
      <h2>CONTACT</h2>
      <p>Email / Instagram / Other Contact</p>
    </div>
  </section>

</body>
</html>
