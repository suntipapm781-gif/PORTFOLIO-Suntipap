<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PORTFOLIO : SUNTIPAP MEEMANGKANG</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .menu {
      display: flex;
      gap: 30px;
    }

    .menu a {
      color: #111111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    #home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 40px 80px;
    }

    .hero {
      width: 100%;
      max-width: 1400px;
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(50px, 10vw, 150px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 900;
    }

    #works {
      padding: 80px 40px;
    }

    .works-container {
      max-width: 1400px;
      margin: auto;
    }

    .work {
      margin-bottom: 120px;
    }

    .work img {
      width: 100%;
      height: auto;
      display: block;
    }

    .work-title {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 700;
    }

    #contact {
      min-height: 70vh;
      padding: 120px 40px;
      display: flex;
      align-items: center;
    }

    .contact-container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
    }

    .contact-container h2 {
      font-size: clamp(50px, 10vw, 140px);
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .contact-container p {
      margin-top: 40px;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      nav {
        padding: 20px;
      }

      .logo {
        font-size: 14px;
      }

      #home,
      #works,
      #contact {
        padding-left: 20px;
        padding-right: 20px;
      }

      .menu {
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">
      PORTFOLIO : SUNTIPAP MEEMANGKANG
    </div>

    <div class="menu">
      <a href="#home">HOME</a>
      <a href="#contact">CONTACT</a>
    </div>
  </nav>


  <section id="home">

    <div class="hero">
      <h1>
        PORTFOLIO :<br>
        SUNTIPAP<br>
        MEEMANGKANG
      </h1>
    </div>

  </section>


  <section id="works">

    <div class="works-container">

      <div class="work">
        <img src="works/3.png" alt="Portfolio Work 01">

        <div class="work-title">
          Work 01
        </div>
      </div>

    </div>

  </section>


  <section id="contact">

    <div class="contact-container">

      <h2>CONTACT</h2>

      <p>
        Email / Instagram / Other Contact
      </p>

    </div>

  </section>

</body>
</html>
