<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PORTFOLIO : SUNTIPAP MEEMANGKANG</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       HEADER
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #c9bb9b;
    }

    .menu {
      display: flex;
      gap: 28px;
    }

    .menu a {
      color: #111111;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    /* =========================
       HERO
    ========================= */

    #home {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .hero {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
    }

    /* =========================
       WORKS
    ========================= */

    #works {
      width: 100%;
      padding: 100px 0;
    }

    .works-container {
      width: 100%;
      margin: 0;
    }

    .work {
      width: 100%;
      margin-bottom: 120px;
    }

    .work img {
      display: block;
      width: 100%;
      height: auto;
    }

    .work-title {
      padding: 18px 28px 0;
      font-size: 18px;
      font-weight: 700;
    }

    /* =========================
       CONTACT
    ========================= */

    #contact {
      min-height: 70vh;
      padding: 120px 28px;
      display: flex;
      align-items: center;
    }

    .contact-container {
      width: 100%;
      margin: auto;
    }

    .contact-container h2 {
      font-size: clamp(50px, 10vw, 140px);
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .contact-container p {
      margin-top: 40px;
      font-size: 18px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      nav {
        padding: 16px 18px;
      }

      .logo {
        font-size: 11px;
      }

      .menu {
        gap: 16px;
      }

      .menu a {
        font-size: 11px;
      }

      #works {
        padding: 60px 0;
      }

      .work-title {
        padding-left: 18px;
        padding-right: 18px;
      }

      #contact {
        padding: 100px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <nav>

    <div class="logo">
      PORTFOLIO : SUNTIPAP MEEMANGKANG
    </div>

    <div class="menu">
      <a href="#home">HOME</a>
      <a href="#contact">CONTACT</a>
    </div>

  </nav>


  <!-- HERO -->

  <section id="home">

    <div class="hero">

      <img
        src="works/1.png"
        alt="Portfolio Hero"
      >

    </div>

  </section>

  <section id="works">

  <div class="works-container">

    <div class="work">
      <img src="works/4.png" alt="Work 03">
    </div>

  </div>

</section>


  <!-- WORKS -->

  <section id="works">

    <div class="works-container">

      <!-- งานอื่น ๆ จะเพิ่มตรงนี้ -->

    </div>

  </section>


  <!-- CONTACT -->

  <section id="contact">

    <div class="contact-container">

      <h2>CONTACT</h2>

      <p>
        Email / Instagram / Other Contact
      </p>

    </div>

  </section>


</body>
</html>
